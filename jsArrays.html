<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working wiuth JavaScript Arrays</title>
</head>
<body>
    <script>

        // Indexing in Arrays

        let arr = ["Namrata", "Sakshi", "Ganesh"]
        console.log(arr[0])
        console.log(arr[1])
        console.log(arr[2])
        let arr1 = new Array(10,20,30)
        console.log(arr1[0])
        console.log(arr1[1])
        console.log(arr1[2])


        // Looping in Arrays

        let arr2 = [10,20,30,40]
        for(let i = 0; i < arr.length; i++){
            console.log(arr[i])
        }


        // Looping Example using Fruits

        // using enhanced method of Looping
        let fruits = ["Apple", "Banana", "Mango", "Pineapple", "Grapes", "Watermelon"]
        for(num of fruits){
            console.log(num)
        }

        // using traditional method of Looping
        for( let i = 0; i < fruits.length; i++){
            console.log(fruits[i])
        }


        
    </script>
</body>
</html>
